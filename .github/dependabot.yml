version: 2
updates:
  - package-ecosystem: gradle
    directory: /
    schedule:
      interval: weekly
    groups:
      # One PR per week for routine updates instead of dozens.
      minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: pip
    directory: /ImageFrameServer
    schedule:
      interval: weekly

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
