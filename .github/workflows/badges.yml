name: Badges

# Counts the lines of code (non-blank Kotlin and Python lines) after every push to main and
# stores them as a shields.io endpoint JSON on the `badges` branch, read by the README badge.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency: badges

permissions:
  contents: write

jobs:
  lines-of-code:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - name: Count lines of code
        run: |
          lines=$(git ls-files -z '*.kt' '*.kts' '*.py' | xargs -0 cat | grep -cvE '^[[:space:]]*$')
          message=$(awk -v n="$lines" 'BEGIN { if (n >= 1000) printf "%.1fk", n / 1000; else print n }')
          echo "Lines of code: $lines ($message)"
          mkdir -p "$RUNNER_TEMP/badges"
          printf '{"schemaVersion":1,"label":"lines of code","message":"%s","color":"blue"}\n' "$message" \
            > "$RUNNER_TEMP/badges/loc.json"

      # One commit on an orphan branch, replaced every time: the branch stays tiny.
      - name: Publish to the badges branch
        env:
          GH_TOKEN: ${{ github.token }}
        working-directory: ${{ runner.temp }}/badges
        run: |
          git init -q -b badges
          git add loc.json
          git -c user.name="github-actions[bot]" \
            -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -q -m "Update badges"
          git push -q -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" badges
