name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  android:
    name: Android app
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      # verifyPaparazziDebug runs all unit tests and compares the screenshots
      # with the checked-in images.
      - name: Unit tests, screenshots, lint, build
        run: ./gradlew verifyPaparazziDebug lintDebug assembleDebug

      - name: Upload reports and screenshot diffs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: android-reports
          path: |
            app/build/reports/
            app/build/paparazzi/failures/
          if-no-files-found: ignore

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: picfort-debug-apk
          path: app/build/outputs/apk/debug/*.apk

  frame-server:
    name: Frame server (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        # 3.11 is Raspberry Pi OS Bookworm's Python.
        python: ["3.11", "3.13"]
    defaults:
      run:
        working-directory: ImageFrameServer
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: ImageFrameServer/requirements.txt

      - run: pip install -r requirements.txt

      - run: python -m unittest discover -s tests -t tests -v
