name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Maven Central occasionally times out from runners; be patient and retry.
  GRADLE_OPTS: >-
    -Dorg.gradle.internal.http.connectionTimeout=60000
    -Dorg.gradle.internal.http.socketTimeout=120000
    -Dorg.gradle.internal.repository.max.retries=5

permissions:
  contents: read

jobs:
  android:
    name: Android app
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v6

      # services.gradle.org sometimes stalls from runners; retry fetching Gradle
      # before the build (cached by setup-gradle after the first success).
      - name: Download Gradle
        run: |
          for attempt in 1 2 3; do
            ./gradlew --version && exit 0
            echo "Gradle download failed (attempt $attempt), retrying in 15 s"
            sleep 15
          done
          exit 1

      # verifyPaparazziDebug runs all unit tests and compares the screenshots
      # with the checked-in images.
      - name: Unit tests, screenshots, lint, build
        run: ./gradlew verifyPaparazziDebug lintDebug assembleDebug

      - name: Upload reports and screenshot diffs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: android-reports
          path: |
            app/build/reports/
            app/build/paparazzi/failures/
          if-no-files-found: ignore

      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        with:
          name: picfort-debug-apk
          path: app/build/outputs/apk/debug/*.apk

  frame-server:
    name: Frame server (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        # 3.11 is Raspberry Pi OS Bookworm's Python.
        python: ["3.11", "3.13"]
    defaults:
      run:
        working-directory: ImageFrameServer
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: ImageFrameServer/requirements.txt

      - run: pip install -r requirements.txt

      - run: python -m unittest discover -s tests -t tests -v
