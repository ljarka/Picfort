name: Release

# Push a tag like v1.2.0 to build a signed APK and publish a GitHub release.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Decode signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.PICFORT_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Add the PICFORT_KEYSTORE_BASE64 secret (see README, Releases)."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
          echo "PICFORT_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Test and build signed APK
        env:
          PICFORT_KEYSTORE_PASSWORD: ${{ secrets.PICFORT_KEYSTORE_PASSWORD }}
          PICFORT_KEY_ALIAS: ${{ secrets.PICFORT_KEY_ALIAS }}
          PICFORT_KEY_PASSWORD: ${{ secrets.PICFORT_KEY_PASSWORD }}
          PICFORT_VERSION_NAME: ${{ github.ref_name }}
          # Always increasing; offset keeps it above the old hard-coded 1.
          PICFORT_VERSION_CODE: ${{ github.run_number }}0
        run: ./gradlew verifyPaparazziDebug assembleRelease

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          apk="picfort-${GITHUB_REF_NAME}.apk"
          cp app/build/outputs/apk/release/app-release.apk "$apk"
          gh release create "$GITHUB_REF_NAME" "$apk" --title "Picfort $GITHUB_REF_NAME" --generate-notes
