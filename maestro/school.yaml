# T-029, T-068: "+" → Family → "Goes to school" adds a child, set the bell schedule, enter a day with
# "Save and add next", copy it to Tuesday, then switch "Goes to school" off.
# Test server only: scripts/test-data.js empties School first; the family has "Ola" and "Kuba".
appId: com.github.ljarka.immich.android2
name: School — timetable (T-029)
---
- runScript:
    file: scripts/test-data.js
    env:
      SCHOOL: "1"
- runFlow: subflows/open-app.yaml
- tapOn: "School"

# Only "+" at first; it opens Family settings, where "Goes to school" is switched on (T-068).
# Kuba is a person added by hand (not an Immich user).
- extendedWaitUntil:
    visible: "Tap \\+ and switch on .*Goes to school.* for each child"
    timeout: 10000
- tapOn: "Family settings"
- tapOn: "Kuba"
- tapOn: "Goes to school"
- tapOn: "^Save$"
- pressKey: back
- extendedWaitUntil:
    visible: "No school today|.*finish.*school.*"
    timeout: 10000
- assertVisible: "Kuba"

# Bell schedule: edit mode, tap the selected child, Fill in
- tapOn: "Edit timetable"
- tapOn: "Kuba"
- tapOn: "Set up lesson times"
- scrollUntilVisible:
    element: "^Fill in$"
- tapOn: "^Fill in$"
- assertVisible: "Remove period 8"
- scrollUntilVisible:
    element: "^Save$"
- tapOn: "^Save$"
- extendedWaitUntil:
    notVisible: "Generate times"
    timeout: 10000

# Monday: two lessons without closing the form
- tapOn: "Mon.*"
- tapOn: "Add lesson or activity"
- tapOn: "Subject"
- inputText: "Maths"
- hideKeyboard
- scrollUntilVisible:
    element: "Save and add next"
- tapOn: "Save and add next"
- scrollUntilVisible:
    element: "Added 1 · next on Monday"
    direction: UP
    timeout: 10000
- tapOn: "Subject"
- inputText: "Polish"
- hideKeyboard
- scrollUntilVisible:
    element: "^Save$"
- tapOn: "^Save$"
- extendedWaitUntil:
    visible: "Period 2, .*Polish.*"
    timeout: 10000
- assertVisible: "Period 1, .*Maths.*"

# Copy Monday to Tuesday
- tapOn: "Copy lessons to…"
- tapOn: "Tuesday"
- tapOn: "Copy"
- tapOn: "Tue.*"
- extendedWaitUntil:
    visible: "Period 1, .*Maths.*"
    timeout: 10000

# Read only outside edit mode; then switch "Goes to school" off in Family (Kuba stays in the family)
- tapOn: "Done editing"
- assertNotVisible: "Add lesson or activity"
- tapOn: "Family settings"
- tapOn: "Kuba"
- tapOn: "Goes to school"
- assertVisible: "Their timetable is deleted when you save"
- tapOn: "^Save$"
- pressKey: back
- extendedWaitUntil:
    visible: "Tap \\+ and switch on .*Goes to school.* for each child"
    timeout: 10000
