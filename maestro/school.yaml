# T-029, T-066: add a family member to School with "+", set the bell schedule, enter a day with
# "Save and add next", copy it to Tuesday, then remove them from School.
# Test server only: scripts/test-data.js empties School first; the family has "Ola" and "Kuba".
appId: com.github.ljarka.immich.android2
name: School — timetable (T-029)
---
- runScript:
    file: scripts/test-data.js
    env:
      SCHOOL: "1"
- runFlow: subflows/open-app.yaml
- tapOn: "School"

# Only "+" at first; it lists the family
- extendedWaitUntil:
    visible: "Tap \\+ to add who goes to school"
    timeout: 10000
- tapOn: "Add"
- assertVisible: "Who goes to school\\?"
# Both Immich users (Ola) and people added by hand (Kuba) are offered (T-066)
- assertVisible:
    text: "Kuba"
    below: "Who goes to school\\?"
- tapOn: "Ola"
- extendedWaitUntil:
    visible: "No school today|.*finish.*school.*"
    timeout: 10000

# Bell schedule: edit mode, tap the selected child, Fill in
- tapOn: "Edit timetable"
- tapOn: "Ola"
- tapOn: "Set up lesson times"
- scrollUntilVisible:
    element: "^Fill in$"
- tapOn: "^Fill in$"
- assertVisible: "Remove period 8"
- scrollUntilVisible:
    element: "^Save$"
- tapOn: "^Save$"
- extendedWaitUntil:
    notVisible: "Generate times"
    timeout: 10000

# Monday: two lessons without closing the form
- tapOn: "Mon.*"
- tapOn: "Add lesson or activity"
- tapOn: "Subject"
- inputText: "Maths"
- hideKeyboard
- scrollUntilVisible:
    element: "Save and add next"
- tapOn: "Save and add next"
- scrollUntilVisible:
    element: "Added 1 · next on Monday"
    direction: UP
    timeout: 10000
- tapOn: "Subject"
- inputText: "Polish"
- hideKeyboard
- scrollUntilVisible:
    element: "^Save$"
- tapOn: "^Save$"
- extendedWaitUntil:
    visible: "Period 2, .*Polish.*"
    timeout: 10000
- assertVisible: "Period 1, .*Maths.*"

# Copy Monday to Tuesday
- tapOn: "Copy lessons to…"
- tapOn: "Tuesday"
- tapOn: "Copy"
- tapOn: "Tue.*"
- extendedWaitUntil:
    visible: "Period 1, .*Maths.*"
    timeout: 10000

# Read only outside edit mode; then remove Ola from School (she stays in the family)
- tapOn: "Done editing"
- assertNotVisible: "Add lesson or activity"
- tapOn: "Edit timetable"
- tapOn: "Ola"
- scrollUntilVisible:
    element: "Remove from School"
- tapOn: "Remove from School"
- tapOn: "^Remove$"
- extendedWaitUntil:
    visible: "Tap \\+ to add who goes to school"
    timeout: 10000
