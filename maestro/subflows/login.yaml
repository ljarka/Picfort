# Fresh install: Immich and the Picfort server on one setup screen (T-058). Values come from
# scripts/maestro-smoke.sh (MAESTRO_* env vars read from ~/.config/picfort/test.env); never
# hardcode credentials here.
appId: com.github.ljarka.immich.android2
---
- tapOn: "Immich address"
- inputText: ${MAESTRO_IMMICH_URL}
- tapOn: "Email"
- inputText: ${MAESTRO_IMMICH_EMAIL}
- tapOn: "Password"
- inputText: ${MAESTRO_IMMICH_PASSWORD}
- hideKeyboard
- scrollUntilVisible:
    element: "Picfort server address"
    centerElement: true
- tapOn: "Picfort server address"
- inputText: ${MAESTRO_PICFORT_SERVER}
- hideKeyboard
- scrollUntilVisible:
    element: "Connect"
- tapOn: "Connect"
- extendedWaitUntil:
    notVisible: "Welcome to Picfort"
    timeout: 30000
