# The selection sheet's actions sit above the floating tab bar (they were under it).
# Tapping "Album" must open the album dialog, not hit the tab bar. Nothing is changed.
appId: com.github.ljarka.immich.android2
name: Photos — selection actions above the tab bar
---
- runFlow: subflows/open-app.yaml
- tapOn: "Photos"
- extendedWaitUntil:
    visible: "Timeline"
    timeout: 10000
- longPressOn:
    point: "25%,45%"
- extendedWaitUntil:
    visible: "1 selected"
    timeout: 5000
- tapOn: "Album"
- assertVisible: "Add to album"
- tapOn: "Cancel"
- assertVisible: "Delete"
- back
- assertNotVisible: "1 selected"
